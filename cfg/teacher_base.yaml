# Teacher Edition - Configuración base para planificador docente
#
# Este archivo va DESPUÉS de los archivos de dispositivo/plantilla
# (rm2.*.yaml, template_*.yaml) en la cadena de configs, para que las
# preferencias del docente ganen. Solo contiene las claves que cambian
# respecto a base.yaml; todo lo demás (papel, márgenes, medidas) lo ponen
# base.yaml y el archivo de dispositivo.

weekstart: 1          # Lunes como primer día
ampmtime: false       # Formato 24h (típico en Europa)
dotted: false         # Líneas en lugar de puntos (preferencia confirmada por el usuario)
calafterschedule: false
addlasthalfhour: false

# Período académico: septiembre (mes 9) durante 12 meses => sept-agosto.
# Se usan 12 meses (en vez de 10, sept-junio) para que los 4 trimestres
# queden exactamente iguales (3 meses cada uno), que es lo que asumen los
# templates de layout (quarterly, months-on-side). Con 10 meses el último
# trimestre queda con 1 solo mes y el layout se rompe (huecos vacíos).
# Julio y agosto quedan igualmente generados (vacaciones), sin más coste.
startmonth: 9
nummonths: 12

# Días no lectivos (festivos, vacaciones y cualquier otra entrada con
# `kind: holiday` del calendario escolar): rojo suave en las celdas de
# los calendarios y en el recuadro con el nombre del día en la página
# diaria. red!18 es un 18 % de rojo sobre blanco (#FFD1D1); en escala de
# grises (ReMarkable 2) da el mismo gris claro que antes (gray!25), así
# que en la tableta no cambia nada. Para volver al gris: gray!25.
layout:
  colors:
    holidayfill: red!18
