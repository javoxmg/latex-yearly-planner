# Teacher Edition - Horario semanal de clases (FASE 2)
#
# Este archivo va el ÚLTIMO en la cadena de configs, para que sus valores
# ganen a los de los archivos de dispositivo (rm2.*.yaml).
#
# Con `schedule.enabled: true`, la columna "Schedule" de cada página diaria
# pasa a ser una rejilla de horas lectivas (de dailybottomhour a
# dailytophour, ambas incluidas) con un bloque sombreado por cada clase de
# ese día de la semana. Los fines de semana y las vacaciones muestran la
# misma rejilla, sin bloques.
#
# Para cambiar el horario de un curso a otro solo hay que editar la lista
# `classes` de abajo:
#   day:   1 = lunes, 2 = martes, 3 = miércoles, 4 = jueves, 5 = viernes
#   start / end: hora de inicio y fin en formato HH:MM (24h)
#   name:  texto corto que se imprime dentro del bloque
#   group: nombre completo del grupo (de momento informativo; en FASE 4
#          servirá para enlazar el bloque con la lista de alumnos)

layout:
  numbers:
    dailybottomhour: 8     # primera fila: 08:00
    dailytophour: 14       # última fila: 14:00-15:00 (la rejilla acaba a las 15:00)

  lengths:
    dailyhourheight: 2.5cm # altura de cada hora en la columna de horario (7 horas x 2.5cm llenan la página)
    schedulegutter: 6mm    # hueco a la izquierda para el número de la hora

  colors:
    classfill: gray!15     # relleno de los bloques de clase si no hay `schedule.palette`
    breakfill: gray!66     # relleno del bloque de recreo (gris 171, más oscuro que cualquier clase)

schedule:
  enabled: true

  # Días con jornada en el centro (1 = lunes ... 5 = viernes). Solo estos
  # días muestran las cajas de los periodos; el resto (fin de semana) sale
  # con la rejilla vacía.
  days: [1, 2, 3, 4, 5]

  # Marco horario de la jornada, igual todos los días: los 6 periodos
  # lectivos y el recreo. Cada periodo sin clase se dibuja como una caja
  # vacía (hora de permanencia); el recreo va marcado con `break: true`.
  periods:
    - { start: "08:30", end: "09:20" }
    - { start: "09:25", end: "10:15" }
    - { start: "10:20", end: "11:10" }
    - { start: "11:10", end: "11:35", name: "RECREO", break: true }
    - { start: "11:35", end: "12:25" }
    - { start: "12:30", end: "13:20" }
    - { start: "13:25", end: "14:15" }

  # Colores por materia. Cada materia distinta toma un color de esta
  # lista, en el orden en que aparece por primera vez en `classes` (aquí:
  # CdM, Mat II, MACS I, Mat). Si hay más materias que colores, se vuelve
  # a empezar por el primero.
  #
  # La materia de cada clase es la parte de `group` antes de " - "
  # ("Matemáticas II - 2BCB" -> "Matemáticas II"); se puede forzar con un
  # campo `subject:` en la clase. Para cambiar el color de una materia
  # basta con cambiar el código de su posición en la lista.
  #
  # Son colores suaves que, además del tono, tienen luminosidades
  # distintas para seguir distinguiéndose en la ReMarkable 2, que los
  # muestra en gris. La RM2 tiene 16 niveles de gris; los cuatro primeros
  # colores caen en cuatro niveles seguidos (el que se indica entre
  # paréntesis, de 0 negro a 255 blanco) y el recreo (breakfill, gris
  # 171) queda en el siguiente, más oscuro que todas las clases. Los dos
  # últimos están a medio camino: en el móvil se distinguen por el tono,
  # pero en la RM2 se parecerán al de al lado.
  #
  # Se admite un código HTML de 6 cifras o cualquier color de xcolor
  # ("gray!15"). Quitando la lista se vuelve al gris único de classfill.
  palette:
    - "FFECCC"   # 1 arena     (gris 238)
    - "C2E5FB"   # 2 azul      (gris 221)
    - "BED7BA"   # 3 verde     (gris 204)
    - "DBADB0"   # 4 rosa      (gris 187)
    - "E6E0FB"   # 5 lila      (gris 229)
    - "B3E2E1"   # 6 turquesa  (gris 212)

  # `until` (opcional): último día de clase de ese grupo, si es distinto
  # del fin de curso general (schedule.to en teacher_calendar_*.yaml).
  # 2º Bachillerato acaba el 21 de mayo y 1º Bachillerato el 17 de junio.
  classes:
    # Lunes
    - { day: 1, start: "08:30", end: "09:20", name: "CdM · 3ºA/D",    group: "Conocimiento de las Matemáticas - 03A, 03D" }
    - { day: 1, start: "09:25", end: "10:15", name: "Mat II · 2ºBCB", group: "Matemáticas II - 2BCB", until: "2027-05-21" }
    - { day: 1, start: "11:35", end: "12:25", name: "MACS I · 1ºBHS", group: "Matemáticas Aplicadas a las Ciencias Sociales I - 1BHS", until: "2027-06-17" }
    # Martes
    - { day: 2, start: "08:30", end: "09:20", name: "CdM · 2ºB/D",    group: "Conocimiento de las Matemáticas - 02B, 02D" }
    - { day: 2, start: "10:20", end: "11:10", name: "MACS I · 1ºBHS", group: "Matemáticas Aplicadas a las Ciencias Sociales I - 1BHS", until: "2027-06-17" }
    - { day: 2, start: "11:35", end: "12:25", name: "Mat II · 2ºBCB", group: "Matemáticas II - 2BCB", until: "2027-05-21" }
    - { day: 2, start: "12:30", end: "13:20", name: "Mat · 3ºA/B",    group: "Matemáticas - 03A, 03B" }
    # Miércoles
    - { day: 3, start: "08:30", end: "09:20", name: "CdM · 2ºB/D",    group: "Conocimiento de las Matemáticas - 02B, 02D" }
    - { day: 3, start: "09:25", end: "10:15", name: "CdM · 3ºA/D",    group: "Conocimiento de las Matemáticas - 03A, 03D" }
    - { day: 3, start: "12:30", end: "13:20", name: "Mat · 3ºA/B",    group: "Matemáticas - 03A, 03B" }
    # Jueves
    - { day: 4, start: "10:20", end: "11:10", name: "Mat · 3ºA/B",    group: "Matemáticas - 03A, 03B" }
    - { day: 4, start: "11:35", end: "12:25", name: "MACS I · 1ºBHS", group: "Matemáticas Aplicadas a las Ciencias Sociales I - 1BHS", until: "2027-06-17" }
    - { day: 4, start: "12:30", end: "13:20", name: "Mat II · 2ºBCB", group: "Matemáticas II - 2BCB", until: "2027-05-21" }
    # Viernes
    - { day: 5, start: "09:25", end: "10:15", name: "Mat II · 2ºBCB", group: "Matemáticas II - 2BCB", until: "2027-05-21" }
    - { day: 5, start: "10:20", end: "11:10", name: "MACS I · 1ºBHS", group: "Matemáticas Aplicadas a las Ciencias Sociales I - 1BHS", until: "2027-06-17" }
    - { day: 5, start: "11:35", end: "12:25", name: "Mat · 3ºA/B",    group: "Matemáticas - 03A, 03B" }
